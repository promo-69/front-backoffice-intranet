name: Run Tests

on:
  pull_request:
    branches: [ development ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable


      - name: Install dependencies
        run: yarn install --immutable

      - name: Run tests
        run: yarn test 
